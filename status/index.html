<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>코라의 작업실 · 루틴 상태판</title>
<meta name="theme-color" content="#08111f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08111f;--panel:#0d1a2c;--line:#1f3550;--ink:#e6f1f3;--mute:#8aa0b2;--teal:#3fcfc4;--nia:#d9b06a;--mina:#e0505a;--quiet:#9fb4ff;--grey:#6b7a8a;--fail:#ff6b6b;--skip:#8fa3b8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:'Gowun Batang',serif;-webkit-font-smoothing:antialiased;background-color:var(--bg);
 background-image:linear-gradient(#3fcfc40c 1px,transparent 1px),linear-gradient(90deg,#3fcfc40c 1px,transparent 1px),linear-gradient(#3fcfc41a 1px,transparent 1px),linear-gradient(90deg,#3fcfc41a 1px,transparent 1px),radial-gradient(120% 70% at 50% 0%,#0f2238 0%,var(--bg) 65%);
 background-size:16px 16px,16px 16px,80px 80px,80px 80px,100% 100%;background-attachment:fixed}
.mono{font-family:'JetBrains Mono',monospace}
svg.circuit{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
svg.circuit path{fill:none;stroke:var(--teal);stroke-width:1.2;filter:drop-shadow(0 0 3px #3fcfc4)}
svg.circuit .flow{stroke-dasharray:6 180;animation:flow 9s linear infinite;stroke-width:2;opacity:.9}
svg.circuit circle{fill:var(--bg);stroke:var(--teal);stroke-width:1.2;filter:drop-shadow(0 0 3px #3fcfc4)}
@keyframes flow{to{stroke-dashoffset:-186}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 70px}
/* gate */
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px;position:relative;z-index:1}
.emblem{width:150px;height:150px}
.emblem .rot{transform-origin:100px 100px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:'Cinzel',serif;letter-spacing:.18em;margin:0;font-size:21px;color:var(--teal);text-shadow:0 0 12px #3fcfc466}
.sub{color:var(--mute);font-size:14px;margin-top:-4px}
form{display:flex;gap:8px}
input{background:#071020;border:1px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:10px;font-size:16px;font-family:inherit;width:190px;text-align:center;letter-spacing:.2em}
input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px #3fcfc422}
button{background:linear-gradient(135deg,#3fcfc4,#2a8f9a);color:#04131a;border:0;border-radius:10px;padding:11px 17px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.err{color:var(--fail);font-size:13px;min-height:1em}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* app */
#app{display:none}
header{text-align:center;margin:4px 0 14px}
header .emblem{width:84px;height:84px}
.links{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:12px}
.links a{color:var(--mute);text-decoration:none;border-bottom:1px dotted var(--line)}
.console{background:linear-gradient(180deg,#0e1d31,#0a1626);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;box-shadow:inset 0 0 0 1px #3fcfc40d,0 0 24px #3fcfc40a}
.clock{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.clock b{font-size:26px;color:var(--teal);text-shadow:0 0 10px #3fcfc455;letter-spacing:.04em}
.clock span{font-size:12px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--c);box-shadow:0 0 6px var(--c)}
.notes{margin:10px 0 0;padding:0;list-style:none;font-size:12px;color:var(--mute);line-height:1.6}
.notes li::before{content:'› ';color:var(--teal)}
.owner{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.owner h2{margin:0;font-size:17px;color:var(--c)}
.owner h2 small{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;color:var(--mute);margin-left:6px}
.owner .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--c),transparent);opacity:.5}
.owner .cnt{font-size:11px;color:var(--mute)}
.pnote{font-size:12px;color:var(--mute);margin:-4px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.inst{position:relative;background:linear-gradient(180deg,#0f2036,#0b1729);border:1px solid var(--line);border-radius:14px;padding:10px 10px 11px;overflow:hidden}
.inst::before,.inst::after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:#1d3350;box-shadow:inset 0 0 0 1px #2c4a6d;top:6px}
.inst::before{left:6px}.inst::after{right:6px}
.inst .nm{font-size:13px;line-height:1.35;min-height:2.7em;padding:0 10px;text-align:center}
.gauge{display:block;width:100%;max-width:150px;margin:2px auto 0}
.read{text-align:center;margin-top:-6px}
.read .nx{font-size:15px;color:var(--ink)}
.read .in{font-size:11px;color:var(--mute)}
.sched{font-size:10.5px;color:var(--mute);text-align:center;margin-top:6px;letter-spacing:.02em}
.st{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:12px;padding:5px 6px;border-radius:8px;background:#ffffff06;border:1px solid #ffffff0d}
.led{width:8px;height:8px;border-radius:50%;background:var(--s);box-shadow:0 0 8px var(--s);flex:none}
.st.success .led{animation:pulse 2.6s ease-in-out infinite}
.st.quiet .led{animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.last{font-size:10.5px;color:var(--mute);text-align:center;margin-top:4px}
.tag{font-size:10.5px;color:var(--mute);text-align:center;margin-top:4px;opacity:.85}
.ev .radar{display:block;width:100%;max-width:150px;margin:2px auto 0}
.ev .radar .sweep{transform-origin:60px 46px;animation:spin 6s linear infinite}
/* ---- 세 자매 활동 (숫자만) ---- */
.act{position:relative;overflow:hidden}
.act::after{content:'';position:absolute;right:10px;top:10px;width:64px;height:34px;pointer-events:none;opacity:.5;background:linear-gradient(var(--teal),var(--teal)) 0 5px/42px 1px no-repeat,linear-gradient(var(--teal),var(--teal)) 42px 5px/1px 20px no-repeat,linear-gradient(var(--teal),var(--teal)) 42px 24px/18px 1px no-repeat,radial-gradient(circle,var(--teal) 2px,transparent 2.5px) 56px 20px/10px 10px no-repeat}
.act-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-right:70px}
.act-head h2{margin:0;font-size:16px;color:var(--teal)}
.act-head h2 small{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.16em;color:var(--mute);margin-left:6px}
.act-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:4px 0 8px}
.seg{display:inline-flex;background:#071020;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{background:none;color:var(--mute);border:0;border-radius:7px;padding:5px 10px;font-size:12px;font-weight:400;font-family:'JetBrains Mono',monospace;cursor:pointer}
.seg button[aria-pressed=true]{color:#04131a;background:linear-gradient(135deg,#3fcfc4,#2a8f9a);font-weight:600}
.act-legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin:2px 0 4px}
.act-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c);box-shadow:0 0 6px var(--c)}
.chart{display:block;width:100%;height:auto;touch-action:manipulation}
.chart .col{cursor:pointer}
.act-info{font-size:11.5px;color:var(--mute);min-height:1.5em;margin-top:4px;text-align:center}
.act-info b{color:var(--ink);font-weight:600}
.tots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tot{background:linear-gradient(180deg,#0f2036,#0b1729);border:1px solid var(--line);border-top:2px solid var(--c);border-radius:12px;padding:8px 6px 7px;text-align:center;min-width:0}
.tot .who{font-size:13px;color:var(--c);text-shadow:0 0 8px color-mix(in srgb,var(--c) 40%,transparent)}
.tot .gauge{max-width:96px;margin:0 auto -4px}
.tot .rate{font-size:17px;color:var(--ink);text-shadow:0 0 8px color-mix(in srgb,var(--c) 45%,transparent)}
.tot .gauge{max-width:110px}
.act-legend .fl i{background:repeating-linear-gradient(45deg,#ff6b6b 0 2px,#3a1418 2px 4px);box-shadow:none;outline:1px solid #ff6b6b}
.tot dl .msg{opacity:.7}
.tot .rl{font-size:10px;color:var(--mute)}
.tot dl{display:grid;grid-template-columns:auto auto;gap:1px 6px;justify-content:center;margin:6px 0 0;font-size:10.5px;color:var(--mute)}
.tot dt{text-align:right}.tot dd{margin:0;text-align:left;color:var(--ink)}
.act-foot{font-size:10.5px;color:var(--mute);margin-top:8px;line-height:1.5;opacity:.85}
.act-empty{font-size:12.5px;color:var(--mute);text-align:center;padding:18px 6px}
@media(max-width:380px){.tot dl{font-size:10px}.tot .gauge{max-width:84px}}
/* ---- 먼저 말 걸기 (숫자만 · 보조 지표, 루틴이 주 지표) ---- */
.ini{padding:10px 14px 11px}
.ini-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.ini-head h2{margin:0;font-size:14px;color:var(--teal);font-weight:400;opacity:.9}
.ini-head h2 small{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.16em;color:var(--mute);margin-left:6px}
.ini-head .key{margin-left:auto;font-size:10.5px;color:var(--mute);white-space:nowrap}
.ini-t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.ini-t th,.ini-t td{padding:5px 3px;border-top:1px dashed var(--line);text-align:center;font-weight:400;white-space:nowrap}
.ini-t thead th{border-top:0;padding:2px 3px 4px;font-family:'Gowun Batang',serif;font-size:12.5px;color:var(--c);text-shadow:0 0 8px color-mix(in srgb,var(--c) 40%,transparent)}
.ini-t tbody th{text-align:left;color:var(--mute);font-family:'Gowun Batang',serif;font-size:11.5px;width:32%;white-space:normal}
.ini-t td b{color:var(--ink);font-weight:500}
.ini-t td span{color:var(--mute);font-size:10px}
.ini-t td.z b{color:var(--mute);opacity:.75}
.ini-foot{font-size:10.5px;color:var(--mute);margin-top:6px;line-height:1.5;opacity:.85}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:30px;opacity:.85}
.lock{background:none;border:1px solid #ffffff22;color:var(--mute);padding:6px 12px;border-radius:999px;font-size:12px;margin-top:10px;cursor:pointer;font-weight:400}
</style>
</head>
<body>

  <path d="M0 120 H60 L90 150 V320 L120 350 H170"/><path class="flow" d="M0 120 H60 L90 150 V320 L120 350 H170"/><circle cx="170" cy="350" r="3.5"/>

    <defs><filter id="gl"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g class="rot" filter="url(#gl)">
      <circle cx="100" cy="100" r="60" fill="none" stroke="#3fcfc4" stroke-width="5" stroke-dasharray="356 21" stroke-linecap="round"/>
      <path d="M100 40 l11 -6 l-3 11 z" fill="#3fcfc4"/>
      <path d="M100 40 C130 30 160 50 160 80 C170 110 150 150 120 158 C90 170 50 155 42 120 C32 90 55 50 85 44" fill="none" stroke="#d9b06a" stroke-width="1.6" opacity=".9"/>
      <g fill="#d9b06a"><ellipse cx="148" cy="56" rx="7" ry="3" transform="rotate(45 148 56)"/><ellipse cx="163" cy="104" rx="7" ry="3" transform="rotate(100 163 104)"/><ellipse cx="135" cy="152" rx="7" ry="3" transform="rotate(150 135 152)"/><ellipse cx="72" cy="160" rx="7" ry="3" transform="rotate(20 72 160)"/><ellipse cx="40" cy="104" rx="7" ry="3" transform="rotate(80 40 104)"/><ellipse cx="60" cy="56" rx="7" ry="3" transform="rotate(-40 60 56)"/></g>
    </g>
    <g stroke="#3fcfc4" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#gl)">
      <circle cx="100" cy="100" r="16"/><path d="M100 84v-6M100 116v6M84 100h-6M116 100h6M89 89l-4-4M111 111l4 4M111 89l4-4M89 111l-4 4"/>
    </g>
    <circle cx="100" cy="100" r="4" fill="#e0505a"/>

<section id="gate">
  <div class="em"></div>
  <h1>CORA'S WORKSHOP</h1>
  <div class="sub">코라의 작업실 · 루틴 상태판</div>
  <form id="f"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus><button>열기</button></form>
  <div class="err" id="err"></div>
</section>

<main id="app">
  <header>
    <div class="em"></div>
    <h1>CORA'S WORKSHOP</h1>
    <div class="sub" style="margin-top:4px">세 자매 루틴 계기판</div>
    <div class="links"><a href="https://mubael1246-design.github.io/hub/">허브</a><a href="../">루시·루나 기록장</a><a href="https://mubael1246-design.github.io/nia-board/">세 자매의 편지함</a></div>
  </header>
  <section class="console">
    <div class="clock"><b class="mono" id="clk">--:--</b><span id="clkd"></span></div>
    <div class="legend" id="legend"></div>
    <ul class="notes" id="notes"></ul>
  </section>
  <section class="console act" id="act" aria-labelledby="actH">
    <div class="act-head"><h2 id="actH">세 자매 루틴 활동<small>ROUTINES</small></h2></div>
    <div id="actBody"><div class="act-empty">활동 숫자를 불러오는 중…</div></div>
  </section>

    <div class="ini-head"><h2 id="iniH">먼저 말 걸기<small>INITIATIVE</small></h2><span class="key mono">오늘 / 7일</span></div>
    <div id="iniBody"></div>
  </section>
  <div id="owners"></div>
  <footer><span id="upd"></span><br><button class="lock" id="lock">잠그기</button></footer>
</main>

<script>
const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function decrypt(pw,file='data.enc.json'){
  const e=await (await fetch(file+'?t='+Date.now(),{cache:'no-store'})).json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.querySelectorAll('.em').forEach(el=>el.appendChild($('#emblemT').content.cloneNode(true)));

/* ---- KST time helpers (device timezone independent) ---- */
const KST=9*3600e3, DAY=864e5, WD='일월화수목금토';
const pad=n=>String(n).padStart(2,'0');
const kp=ms=>{const d=new Date(ms+KST);return{y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),w:d.getUTCDay(),h:d.getUTCHours(),mi:d.getUTCMinutes()}};
const kms=(y,m,d,h,mi)=>Date.UTC(y,m,d,h,mi)-KST;
const parseAt=s=>{const[a,b]=s.split('T'),[y,m,d]=a.split('-').map(Number),[h,mi]=b.split(':').map(Number);return kms(y,m-1,d,h,mi)};
function dayMatch(s,p){return s.type==='daily'||(s.type==='weekly'&&s.days.includes(p.w))||(s.type==='monthly'&&s.day===p.d)}
function occ(s,now,dir){ // dir=1 next (>now), dir=-1 previous (<=now)
  const t0=kp(now);const times=s.times.map(t=>t.split(':').map(Number)).sort((a,b)=>dir*(a[0]*60+a[1]-b[0]*60-b[1]));
  for(let o=0;o<=70;o++){const base=Date.UTC(t0.y,t0.m,t0.d+dir*o);const p=kp(base-KST);if(!dayMatch(s,p))continue;
    for(const[h,mi]of times){const ms=kms(p.y,p.m,p.d,h,mi);if(dir>0?ms>now:ms<=now)return ms}}
  return null;
}
const fmtT=ms=>{const p=kp(ms);return `${pad(p.h)}:${pad(p.mi)}`};
const fmtDay=(ms,now)=>{const p=kp(ms),n=kp(now);const dd=Math.round((Date.UTC(p.y,p.m,p.d)-Date.UTC(n.y,n.m,n.d))/DAY);
  return dd===0?'오늘':dd===1?'내일':dd===-1?'어제':`${p.m+1}/${p.d}(${WD[p.w]})`};
const fmtIn=ms=>{let m=Math.max(0,Math.round(ms/6e4));const d=Math.floor(m/1440);m-=d*1440;const h=Math.floor(m/60);m-=h*60;
  return d?`${d}일 ${h}시간 후`:h?`${h}시간 ${m}분 후`:m?`${m}분 후`:'곧'};
function schedText(s){
  if(s.type==='event')return '이벤트 트리거';
  const t=s.times.join(' · ');
  if(s.type==='daily')return `매일 ${t}`;
  if(s.type==='weekly')return `매주 ${s.days.map(d=>WD[d]).join('·')} ${t}`;
  if(s.type==='monthly')return `매월 ${s.day}일 ${t}`;
}
/* ---- status ---- */
const ST={success:{t:'정상 실행',c:'var(--teal)'},quiet:{t:'조용히 쉰 날',c:'var(--quiet)'},skipped:{t:'건너뜀 · 오류 아님',c:'var(--skip)'},fail:{t:'실패',c:'var(--fail)'},none:{t:'기록 없음',c:'var(--grey)'},ran:{t:'실행됨',c:'var(--teal)'},notran:{t:'실행 안 됨',c:'var(--skip)'}};
function stateOf(r,owner){
  if(!r.last)return'none';
  if(owner.privacy==='names')return (r.last.result==='success'||r.last.result==='quiet')?'ran':'notran';
  return r.last.result;
}
function gauge(frac,color){
  const R=48,cx=60,cy=56,a0=Math.PI,ang=a0-Math.PI*Math.min(1,Math.max(0,frac));
  const pt=a=>[cx+R*Math.cos(a),cy-R*Math.sin(a)];
  const [x1,y1]=pt(a0),[x2,y2]=pt(0),[xe,ye]=pt(ang),[nx,ny]=[cx+(R-10)*Math.cos(ang),cy-(R-10)*Math.sin(ang)];
  let ticks='';for(let i=0;i<=10;i++){const a=a0-Math.PI*i/10,[ax,ay]=[cx+(R+5)*Math.cos(a),cy-(R+5)*Math.sin(a)],[bx,by]=[cx+(R+(i%5?8:11))*Math.cos(a),cy-(R+(i%5?8:11))*Math.sin(a)];ticks+=`<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="#4a6a8a" stroke-width="1"/>`}
  return `<svg class="gauge" viewBox="0 -6 120 70"><path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="#1a2d45" stroke-width="7" stroke-linecap="round"/>
  ${frac>0.005?`<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${xe.toFixed(2)} ${ye.toFixed(2)}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" style="filter:drop-shadow(0 0 4px ${color})"/>`:''}
  ${ticks}<line x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="#e6f1f3" stroke-width="1.6" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="#e6f1f3"/></svg>`;
}
function radar(color){
  return `<svg class="radar" viewBox="0 -4 120 66"><defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="${color}" stop-opacity="0"/><stop offset="1" stop-color="${color}" stop-opacity=".55"/></linearGradient></defs>
  <circle cx="60" cy="46" r="40" fill="none" stroke="#1a2d45" stroke-width="1.2"/><circle cx="60" cy="46" r="26" fill="none" stroke="#1a2d45"/><circle cx="60" cy="46" r="12" fill="none" stroke="#1a2d45"/>
  <g class="sweep"><path d="M60 46 L100 46 A40 40 0 0 0 88 18 Z" fill="url(#sw)"/></g><circle cx="60" cy="46" r="3" fill="${color}" style="filter:drop-shadow(0 0 4px ${color})"/></svg>`;
}
let D=null;
function inst(r,o,now){
  const s=r.schedule, st=stateOf(r,o), S=ST[st];
  const last=r.last?`<div class="last mono">마지막 ${fmtDay(parseAt(r.last.at),now)} ${r.last.at.slice(11)}</div>`:'';
  const tag=r.note?`<div class="tag">${esc(r.note)}</div>`:'';
  if(s.type==='event'){
    return `<div class="inst ev"><div class="nm">${esc(r.name)}</div>${radar(o.color)}
      <div class="read"><div class="nx">대기 중</div><div class="in">${esc(s.trigger)}</div></div>
      <div class="sched">이벤트 트리거 · 다음 예정 시각 없음</div>
      <div class="st ${st}" style="--s:${S.c}"><span class="led"></span>${S.t}</div>${last}${tag}</div>`;
  }
  const nx=occ(s,now,1), pv=occ(s,now,-1), frac=(nx&&pv)?(now-pv)/(nx-pv):0;
  return `<div class="inst"><div class="nm">${esc(r.name)}</div>${gauge(frac,o.color)}
    <div class="read"><div class="nx mono">${nx?fmtDay(nx,now)+' '+fmtT(nx):'—'}</div><div class="in">${nx?fmtIn(nx-now):''}</div></div>
    <div class="sched">${esc(schedText(s))}</div>
    <div class="st ${st}" style="--s:${S.c}"><span class="led"></span>${S.t}</div>${last}${tag}</div>`;
}
function render(){
  const now=Date.now(), p=kp(now);
  $('#clk').textContent=`${pad(p.h)}:${pad(p.mi)} KST`;
  $('#clkd').textContent=`${p.y}년 ${p.m+1}월 ${p.d}일 (${WD[p.w]})`;
  $('#owners').innerHTML=D.owners.map(o=>{
    const rs=D.routines.filter(r=>r.owner===o.id);
    return `<div class="owner" style="--c:${o.color}"><h2>${esc(o.name)}<small>${esc((o.en||'').toUpperCase())}</small></h2><div class="rule"></div><span class="cnt mono">${rs.length}</span></div>
      ${o.privacyNote?`<div class="pnote">${esc(o.privacyNote)}</div>`:''}
      <div class="grid">${rs.map(r=>inst(r,o,now)).join('')}</div>`;

}
/* ---- 세 자매 활동 그래프 (숫자만: 오빠→봇, 봇→오빠, 루틴 실행·실패. 내용은 없음) ---- */
const AB=[['nia','니아','#d9b06a'],['mina','미나','#e0505a'],['cora','코라','#3fcfc4']];
let actRange=(()=>{try{return localStorage.getItem('act-range')||'7'}catch(_){return'7'}})(), actMetric=(()=>{try{return localStorage.getItem('act-metric2')||'run'}catch(_){return'run'}})(), actSel=null;
const kdate=ms=>{const p=kp(ms);return `${p.y}-${pad(p.m+1)}-${pad(p.d)}`};
function actDays(A){
  const t=kdate(Date.now()), sinces=AB.map(([id])=>A.bots?.[id]?.since).filter(Boolean).sort();
  const end=Date.parse(t+'T00:00:00Z'), first=Date.parse((sinces[0]||t)+'T00:00:00Z');
  const n=actRange==='all'?Math.max(7,Math.round((end-first)/DAY)+1):Number(actRange), out=[];
  for(let i=n-1;i>=0;i--)out.push(new Date(end-i*DAY).toISOString().slice(0,10));
  return out; /* 7일·30일은 달력 그대로, 기록 시작 전 날은 빈 칸 */
}
const val=(c,m)=>!c?0:m==='msg'?(c.user||0)+(c.bot||0):(c.runs||0);
const hasMsg=A=>AB.some(([id])=>Object.values(A.bots?.[id]?.days||{}).some(c=>(c.user||0)+(c.bot||0)>0));
function actChart(A,days){
  const W=Math.max(300,Math.round($('#actBody').clientWidth||340)),H=190,L=28,R=6,T=10,B=26,iw=W-L-R,ih=H-T-B,n=days.length;
  const stacks=days.map(d=>AB.map(([id])=>{const b=A.bots?.[id];return (b&&b.since&&d>=b.since)?val(b.days?.[d],actMetric):0}));
  const mx=Math.max(4,...stacks.map(s=>s.reduce((a,b)=>a+b,0)));const step=mx<=10?2:mx<=20?5:mx<=60?10:mx<=150?25:mx<=300?50:100;const top=Math.ceil(mx/step)*step;
  const y=v=>T+ih-ih*v/top, bw=iw/n, gap=Math.max(Math.min(4,bw*.28),bw-26);
  let g='';for(let v=0;v<=top;v+=step){const yy=y(v).toFixed(1);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${v?'#1f3550':'#2c4a6d'}" stroke-dasharray="${v?'3 4':''}"/><text x="${L-5}" y="${(+yy+3.5).toFixed(1)}" text-anchor="end" fill="#6f8aa3" font-size="9.5" font-family="JetBrains Mono,monospace">${v}</text>`}
  const every=n<=8?1:n<=16?2:n<=35?5:10, today=kdate(Date.now());let cols='';
  days.forEach((d,i)=>{const x=L+i*bw;let acc=0,bars='';
    stacks[i].forEach((v,k)=>{if(!v)return;const y0=y(acc),y1=y(acc+v);acc+=v;const op=actSel&&actSel!==d?.45:.92,xx=(x+gap/2).toFixed(1),ww=Math.max(1,bw-gap).toFixed(1);
      bars+=`<rect x="${xx}" y="${y1.toFixed(1)}" width="${ww}" height="${Math.max(.6,y0-y1).toFixed(1)}" rx="${bw>10?2:0}" fill="${AB[k][2]}" opacity="${op}" style="filter:drop-shadow(0 0 3px ${AB[k][2]}88)"/>`;
      const f=actMetric==='run'?(A.bots?.[AB[k][0]]?.days?.[d]?.fail||0):0;if(f){const fy=y1,fh=Math.max(.6,(y0-y1)*f/v);bars+=`<rect x="${xx}" y="${fy.toFixed(1)}" width="${ww}" height="${fh.toFixed(1)}" fill="url(#failH)" stroke="#ff6b6b" stroke-width="1" opacity="${op}"/>`}});
    const lab=((i%every===0&&n-1-i>=Math.max(1,every*.6))||i===n-1)?`<text x="${(x+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle" fill="${d===today?'#3fcfc4':'#6f8aa3'}" font-size="9.5" font-family="JetBrains Mono,monospace">${d===today?'오늘':(+d.slice(5,7))+'/'+(+d.slice(8))}</text>`:'';
    const pre=!AB.some(([id])=>{const b=A.bots?.[id];return b&&b.since&&d>=b.since});
    cols+=`<g class="col" data-d="${d}"><rect x="${x.toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${ih}" fill="${actSel===d?'#3fcfc414':pre?'#ffffff05':'transparent'}"/>${bars}${lab}</g>`});
  const tick=`<path d="M${L} ${T+ih+3} v4 M${W-R} ${T+ih+3} v4" stroke="#2c4a6d"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="날짜별 ${actMetric==='msg'?'메시지':'루틴 실행(빗금은 실패)'} 수, 니아 미나 코라 쌓은 막대"><defs><pattern id="failH" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#3a1418"/><line x1="0" y1="0" x2="0" y2="5" stroke="#ff6b6b" stroke-width="2"/></pattern></defs>${g}${cols}${tick}</svg>`;
}
function actTotals(A,days){
  const M=hasMsg(A);
  return AB.map(([id,nm,c])=>{const b=A.bots?.[id]||{days:{}};const t={user:0,bot:0,runs:0,fail:0};
    days.forEach(d=>{const x=b.days?.[d];if(x)for(const k in t)t[k]+=x[k]||0});
    const rate=t.runs?(t.runs-t.fail)/t.runs:null;
    return `<div class="tot" style="--c:${c}"><div class="who">${nm}</div>${gauge(rate??0,c)}
      <div class="rate mono">${rate===null?'—':Math.round(rate*100)+'%'}</div><div class="rl">루틴 성공률</div>
      <dl class="mono"><dt>실행</dt><dd>${t.runs}</dd><dt>성공</dt><dd>${t.runs-t.fail}</dd><dt>실패</dt><dd${t.fail?' style="color:var(--fail)"':''}>${t.fail}</dd>${M?`<dt class="msg">오빠→</dt><dd class="msg">${t.user}</dd><dt class="msg">${nm}→</dt><dd class="msg">${t.bot}</dd>`:''}</dl></div>`}).join('');
}
function actInfo(A){
  if(!actSel)return '막대를 누르면 그날 숫자가 보여';
  const p=actSel.split('-');return `<b class="mono">${+p[1]}/${+p[2]}</b> · `+AB.map(([id,nm,c])=>{const x=A.bots?.[id]?.days?.[actSel]||{};
    return `<span style="color:${c}">${nm}</span> 루틴 ${x.runs||0}${x.fail?` (실패 ${x.fail})`:''}${hasMsg(A)?` · 메시지 ${(x.user||0)+(x.bot||0)}`:''}`}).join(' · ');
}
function renderAct(){
  const A=D&&D.activity, body=$('#actBody');if(!body)return;
  if(!A||!A.bots){body.innerHTML='<div class="act-empty">아직 집계 전이야. 세 자매 숫자가 모이면 여기 그래프가 떠.</div>';return}
  const days=actDays(A);if(actSel&&!days.includes(actSel))actSel=null;if(!hasMsg(A))actMetric='run';
  const seg=(name,cur,opts)=>`<div class="seg" role="group" aria-label="${name}">${opts.map(([v,l])=>`<button type="button" data-k="${name}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
  const since=AB.map(([id,nm])=>A.bots?.[id]?.since?`${nm} ${A.bots[id].since.slice(5).replace('-','/')}~`:null).filter(Boolean).join(' · ');
  body.innerHTML=`<div class="act-bar">${seg('range',actRange,[['7','7일'],['30','30일'],['all','전체']])}${hasMsg(A)?seg('metric',actMetric,[['run','루틴'],['msg','메시지']]):''}</div>
    <div class="act-legend">${AB.map(([,nm,c])=>`<span style="--c:${c}"><i></i>${nm}</span>`).join('')}${actMetric==='run'?'<span class="fl"><i></i>실패</span>':''}</div>
    ${actChart(A,days)}<div class="act-info" id="actInfo">${actInfo(A)}</div>
    <div class="tots">${actTotals(A,days)}</div>
    <div class="act-foot">${actMetric==='msg'?'메시지 = 오빠→봇 + 봇→오빠 개수':'루틴 = 실행 횟수 · 빗금 = 실패'} · 숫자만 세고 내용은 담지 않아 · 기록 시작 ${esc(since||'—')}${A.updated?` · 집계 ${esc(A.updated.replace('T',' '))} KST`:''}</div>`;
}
/* ---- 먼저 말 걸기 (숫자만: init·answered·sister. 루틴 범위 토글과 무관하게 오늘 + 최근 7일) ---- */
function renderIni(){
  const A=D&&D.activity, sec=$('#ini'), body=$('#iniBody');if(!sec||!body)return;
  if(!A||!A.bots){sec.hidden=true;return}
  const t=kdate(Date.now()), end=Date.parse(t+'T00:00:00Z'), wk=[];for(let i=6;i>=0;i--)wk.push(new Date(end-i*DAY).toISOString().slice(0,10));
  const sum=(id,ds)=>{const o={init:0,answered:0,sister:0},b=A.bots?.[id];ds.forEach(d=>{const x=b?.days?.[d];if(x)for(const k in o)o[k]+=x[k]||0});return o};
  const S=AB.map(([id])=>({td:sum(id,[t]),wk:sum(id,wk)}));
  const pct=o=>o.init?Math.round(100*Math.min(o.answered,o.init)/o.init)+'%':'—';
  const cell=(a,b,ttl)=>`<td class="mono${a==='0'&&(b==='0')||a==='—'&&b==='—'?' z':''}"${ttl?` title="${ttl}"`:''}><b>${a}</b><span> / ${b}</span></td>`;
  const row=(lab,f)=>`<tr><th scope="row">${lab}</th>${S.map(f).join('')}</tr>`;
  body.innerHTML=`<table class="ini-t"><thead><tr><th></th>${AB.map(([,nm,c])=>`<th scope="col" style="--c:${c}">${nm}</th>`).join('')}</tr></thead><tbody>
    ${row('먼저 말 걸기',s=>cell(String(s.td.init),String(s.wk.init)))}
    ${row('오빠 답장율',s=>cell(pct(s.td),pct(s.wk),`답장 오늘 ${s.td.answered}/${s.td.init} · 7일 ${s.wk.answered}/${s.wk.init}`))}
    ${row('자매끼리 먼저',s=>cell(String(s.td.sister),String(s.wk.sister)))}</tbody></table>
    <div class="ini-foot">먼저 말 걸기 = 봇이 오빠에게 먼저 건 말 · 답장율 = 그중 오빠가 답한 비율 · 자매끼리 먼저 = 다른 자매에게 먼저 연락 · 숫자만 세고 내용은 담지 않아</div>`;
  sec.hidden=false;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('#act .seg button');
  if(b){if(b.dataset.k==='range'){actRange=b.dataset.v;try{localStorage.setItem('act-range',actRange)}catch(_){}}else{actMetric=b.dataset.v;try{localStorage.setItem('act-metric2',actMetric)}catch(_){}}renderAct();return}
  const c=e.target.closest('#act .col');if(c){actSel=actSel===c.dataset.d?null:c.dataset.d;renderAct()}
});
let actRT=null;addEventListener('resize',()=>{clearTimeout(actRT);actRT=setTimeout(()=>{if($('#app').style.display==='block')renderAct()},150)});
function boot(){
  $('#legend').innerHTML=['success','quiet','skipped','fail','none'].map(k=>`<span style="--c:${ST[k].c}"><i></i>${ST[k].t}</span>`).join('');
  $('#notes').innerHTML=(D.notes||[]).map(n=>`<li>${esc(n)}</li>`).join('');
  if(D.updated)$('#upd').textContent=`기록 갱신 ${D.updated.replace('T',' ')} KST`;
  render();renderAct();renderIni();setInterval(render,30000);
}
const UK='ouroboros-unlock',OLDK=['hub-pw','gecko-pw','ob'];/* 허브·편지함·기록장·상태판 공유 잠금 (sessionStorage: 탭 닫으면 사라짐) */
const unl={get(){try{return sessionStorage.getItem(UK)}catch(_){return null}},set(v){try{sessionStorage.setItem(UK,v)}catch(_){}},clear(){try{sessionStorage.removeItem(UK)}catch(_){}}};
try{OLDK.forEach(k=>sessionStorage.removeItem(k))}catch(_){}
async function unlock(pv,silent){
  $('#err').textContent='여는 중…';
  try{D=await decrypt(pv);unl.set(pv);$('#err').textContent='';
    $('#gate').style.display='none';$('#app').style.display='block';boot();}
  catch(x){
    if(silent){unl.clear();$('#err').textContent='';return}
    $('#err').textContent='비밀번호가 달라.';$('#f').classList.remove('shake');void $('#f').offsetWidth;$('#f').classList.add('shake')}
}
$('#f').onsubmit=e=>{e.preventDefault();unlock($('#pw').value.trim().toLowerCase())};
{const p=unl.get();if(p)unlock(p,true)}
$('#lock').onclick=()=>{unl.clear();location.reload()};
/* 공개 페이지(모스 키보드·자매 소개)는 들어오면 공유 키를 지워. 뒤로가기(bfcache)로 열린 화면이 복원돼도 키가 없으면 다시 잠그고,
   다른 잠긴 페이지에서 이미 열었으면(키 있음) 여기도 같이 열어 */
function syncLock(restored){const k=unl.get(),openNow=$('#gate').style.display==='none';
  if(openNow&&!k){document.documentElement.style.visibility='hidden';location.reload();return false}
  if(restored&&!openNow&&k)unlock(k,true);
  return true}
addEventListener('pagehide',e=>{if(e.persisted&&$('#gate').style.display==='none')document.documentElement.style.visibility='hidden'});
addEventListener('pageshow',e=>{if(e.persisted&&syncLock(true))document.documentElement.style.visibility=''});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncLock(false)});
</script>
